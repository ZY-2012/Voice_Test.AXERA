# Voice_Test.AXERA 基准配置
# 所有脚本从此文件读取路径与参数。客户一般只需改 data_root / model_root。

# ============ 路径 ============
paths:
  # 数据根目录（下载/制作的所有测试数据）。本地与 AX 板端为同一共享存储时两侧一致。
  data_root: /data/shared/huyuan/8860_datasets
  # 已适配模型根目录（axmodel + 各模型推理仓库）
  model_root: /data/shared/huyuan/8860_export
  # 板端本地盘模型目录（可选，避免大模型每次从慢速 NFS 冷加载）。
  # 支持 ~ 展开；若此目录下存在同名模型子目录（如 FireRedASR-AED/）则优先用本地盘副本。
  # 留空 = 关闭。host 侧该路径不存在时自动回退 model_root，故两端可共用同一配置。
  model_local_root: ~/asr_local
  # 部分模型需专用 python 环境：填**环境名**（不要写绝对路径，路径由运行时的 conda
  # 安装位置推导，故各人装在哪都能复现）。留空/删除该项 = 用当前环境。
  #   zipvoice 英文的 G2P daemon 依赖 piper_phonemize，它只提供 cp39~cp312 的 wheel，
  #   板端 base 若是 Python 3.13 则装不上，故英文需指向 Python≤3.12 的环境（中文不需要）。
  #   建环境见 tts/README.md §3。
  model_env:
    zipvoice: ZipVoice
  # 结果输出目录（相对本仓库）
  results_dir: results
  # AX650 BSP SDK（交叉编译板端 C++ 可执行用，如 TEN VAD）。需含
  # include/ax_engine_api.h + lib/libax_{engine,interpreter,sys}.so；
  # 也可用环境变量 AX650_SDK_ROOT 覆盖，或作为 build_tenvad.sh 的第一个参数传入。
  ax650_sdk_root: /data/shared/huyuan/toolchains/ax650n_bsp_sdk/msp/out

# ============ 下载 ============
download:
  hf_endpoint: https://hf-mirror.com     # 国内镜像加速
  aria2c_conn: 16                        # aria2c 每文件连接数

# ============ 模块声明（单一事实来源：顺序即展示顺序）============
# label 供 README/汇总标题用；scope 为口径标注模板（{...} 引用 subset 计数，report.py 填充）
modules:
  asr: { label: 语音识别 ASR,   scope: "AISHELL-1 中文 {zh_per_set} 条 CER / ESB 英文各 {en_per_set} 条 WER · RTF 不含加载" }
  vad: { label: 语音活动检测 VAD, scope: "逐句集各 {en_utts} 条 + TEN VAD 官方 {ten_official_utts} 条 + Picovoice 长流 · 帧级指标" }
  se:  { label: 语音增强 SE,    scope: "VoiceBank-DEMAND {pairs} 对 · PESQ/STOI/SI-SNR · RTF 不含加载" }
  tts: { label: 语音合成 TTS,   scope: "AISHELL-3 中文 {zh_utts} 条回环 CER · RTF 不含加载" }

# ============ 汇总/注入（report.py）============
report:
  readme: README.md            # 注入目标（相对仓库根）
  # 每模块主指标（排序/小结用）；缺省取 eval.<module>.metrics[0]
  primary_metric: { asr: cer, vad: f1, se: pesq, tts: cer_loopback }


# ============ 子集抽样（默认 benchmark 口径）============
# 边缘板全量太慢，默认用确定性抽样的固定子集；跑全量加 --full。
subset:
  seed: 20240824          # 确定性抽样随机种子（固定→可复现）
  asr:
    zh_per_set: 200       # 中文每数据集抽样条数（AISHELL-1）
    en_per_set: 100       # 英文每子集抽样条数（ESB 各子集）
  vad:
    en_utts: 200          # LibriVAD/AISHELL 逐句集抽样条数
    picovoice_full: true  # Picovoice 长流是单条音频，不抽样
    ten_official_utts: 30 # TEN VAD 官方测试集全量（共 30 条，数据集名 ten_official）
  se:
    pairs: 200            # VoiceBank-DEMAND 抽样对数
  tts:
    zh_utts: 200          # AISHELL-3 抽样条数
    en_utts: 200          # LJSpeech 抽样条数
    en_librispeech: 200   # LibriSpeech test-clean 抽样条数（英文多说话人，复用 asr/librispeech）
    zh_hardcase: 150      # 中文难例全量（绕口令/长句/数字/同音，见 tts/zh_hardcase.tsv）
    zh_long: 40           # 长句集全量（= 难例集的 hard_long_*）；**RTF 主口径在此集上测**

# ============ VAD 混噪参数（Picovoice 口径）============
vad_mix:
  snr_db: 0
  frame_len: 512          # 32ms @ 16kHz
  silence_sec: 20
  seed: 778               # 与 Picovoice 官方一致

# ============ 模型（HF AXERA-TECH 托管的 axmodel）============
# chip: ax650 / ax630c / ax620q
models:
  chip: ax650
  asr:
    whisper:     { hf: AXERA-TECH/Whisper,        variants: [tiny, base, small, turbo] }
    sensevoice:  { hf: AXERA-TECH/SenseVoice }
    firered:     { hf: AXERA-TECH/FireRedASR-AED-L }
    zipformer:   { hf: AXERA-TECH/Zipformer }
    wenet:       { hf: AXERA-TECH/wenet }
  vad:
    silero:      { hf: AXERA-TECH/silero-vad }
    # TEN VAD：C++ 可执行（无 python 绑定）。dir=模型仓库（含 axmodel + 官方 testset），
    # code_dir=推理代码仓库（github AXERA-TECH/ten-vad.axera），需先 bash vad/build_tenvad.sh 交叉编译
    tenvad:      { hf: AXERA-TECH/ten-vad, dir: ten-vad, code_dir: ten-vad.axera }
  se:
    # 已适配（本地目录名见 tools/model_registry.py；命令模板亦在其中）
    gtcrn:        { hf: AXERA-TECH/gtcrn.axera,        dir: gtcrn.axera }
    fastenhancer: { hf: AXERA-TECH/fastenhancer.axera, dir: fastenhancer.axera }
    deepfilternet3: { hf: AXERA-TECH/DeepFilterNet3.AXERA, dir: DeepFilterNet3.AXERA_HUG }  # 48kHz 模型
    gcrn:          { hf: AXERA-TECH/GCRN,              dir: GCRN }                          # 16kHz
  tts:
    # 已适配（预设音色 kokoro/melotts；零样本 zipvoice/cosyvoice2）
    # enabled: false = 默认不纳入 run.sh（仍可用 TTS_MODELS 显式指定）
    kokoro:       { hf: AXERA-TECH/kokoro.axera,     dir: kokoro.axera, enabled: false }  # 中文合成偏短/截断，待修复
    melotts:      { hf: AXERA-TECH/MeloTTS,          dir: MeloTTS }
    zipvoice:     { hf: AXERA-TECH/ZipVoice.AXERA,   dir: ZipVoice.AXERA_HUG }  # distill 版 num_step=4；HF 副本较完整（cpp/ 由软链补，英文 G2P daemon 需要）
    cosyvoice2:   { hf: AXERA-TECH/Cosyvoice2.Axera, dir: CosyVoice2 }
    # 中英双语零样本（参考音色用包内 Vivian.wav）；HF 推理包自带 axmodel+int8 ONNX+运行时
    pocket_tts_zh_en: { hf: HY-2012/pocket-tts-zh-en.AXERA, dir: pocket-tts-zh-en.AXERA }

# ============ 评估口径 ============
eval:
  asr:
    zh_metric: cer        # 中文字符级
    en_metric: wer        # 英文词级
    normalize: [lower, remove_punct]
  vad:
    frame_ms: 32          # 帧级评估粒度
    metrics: [accuracy, precision, recall, f1, roc_auc]
  se:
    metrics: [pesq, stoi, si_snr]
  tts:
    # 分语言选评测 ASR：均用 firered —— GT 锚点实测它中英双优（ASR 地板最低，
    # 回环值几乎等于纯 TTS 误差）。英文对比（librispeech 真人音频 20 条）：
    # firered WER 3.03% vs sensevoice 5.84%
    asr_model_zh: firered
    asr_model_en: firered
    asr_model: sensevoice   # 兼容旧脚本引用
    metrics: [cer_loopback, wer_loopback, cer_gt, wer_gt,
              sub_rate, del_rate, ins_rate, len_ratio, success_rate, rtf]
